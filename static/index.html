<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlanIDE -- Project Command Deck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <div>
          <div class="brand-name">PlanIDE</div>
          <div class="brand-sub">Command Deck</div>
        </div>
      </div>

      <div class="nav">
        <div class="nav-item" data-nav="overview"><span class="ic">◎</span> Projects
          <span class="badge" id="navProjCount">0</span></div>
        <div class="nav-item" data-nav="add"><span class="ic">＋</span> Add project</div>
      </div>

      <div style="font-size:10.5px;color:var(--text-dimmer);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:14px 6px 6px;">Tracked</div>
      <div class="nav" id="navProjects"></div>

      <div class="side-foot">
        <button class="btn ghost sm" id="themeBtn">◐ Theme</button>
        <div class="side-version" id="sideVersion">PlanIDE</div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <div class="topbar">
        <button class="icon-btn hamburger" id="hamburger">☰</button>
        <div>
          <h1 id="crumb">Projects</h1>
          <div class="sub" id="crumbSub">Track what works, what's broken, and ship it.</div>
        </div>
        <div class="spacer"></div>
        <div id="topActions" class="flex gap8"></div>
      </div>
      <div class="content" id="view"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modal">
      <div class="modal-h"><h3 id="modalTitle">…</h3><div class="spacer"></div>
        <button class="icon-btn" id="modalClose">✕</button></div>
      <div class="modal-b" id="modalBody"></div>
      <div class="modal-f" id="modalFoot"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
